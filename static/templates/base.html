{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %} Music Collectors Catalogue {% endblock %}</title>
    <!-- WEBSITE ICON -->
    <link rel="icon" type="image/x-icon" href="{% static 'images/vinyl-flat-icon.png' %}">
    <!-- GOOGLE FONTS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- BOOTSTRAP -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- MAIN CSS -->
    <link rel="stylesheet" href="{% static 'templates/css/stylesheet.css' %}">
    <link rel="stylesheet" href="{% static 'templates/css/modal.css' %}">
    {% block extra_css %}{% endblock %}

    <script defer src="{% static 'app.js' %}"></script>
    <script defer src="{% static 'year_picker.js' %}"></script>
</head>
<body class="{% block body_class %}{% endblock %}">
    <header class="site-header brand-surface">
        {% include "nav.html" %}
    </header>

    <main class="container">
        {% block content %}
        {% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

</body>
{% comment %} {% load django_browser_reload %}
{% django_browser_reload_script %} {% endcomment %}
</html>
